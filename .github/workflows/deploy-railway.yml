name: Deploy to Railway

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up \
            --detach \
            --ci \
            -p d51fa77c-293f-402f-aa88-e198bef0f258 \
            -s d21df2f9-47e3-45c8-8ca3-3a39438a82ca \
            -e 63f693bc-cb56-4fce-abc8-a292475a4dca
